name: Build & Release

# 推送 v* 开头的 tag（如 v1.0.0）时自动构建并发布
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - run: flutter pub get

      # 从 GitHub Secrets 还原签名文件（key.properties / keystore 均已 gitignore，不会进仓库）
      - name: Setup keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      # 版本号以触发的 tag 为准
      - name: Build release APK
        run: flutter build apk --release --build-name="${GITHUB_REF_NAME#v}"

      # 用 tag 名重命名 APK
      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk "iLearn-${GITHUB_REF_NAME}.apk"

      # 以 tag 名称创建 GitHub Release 并上传 APK
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: iLearn-${{ github.ref_name }}.apk
          generate_release_notes: true
